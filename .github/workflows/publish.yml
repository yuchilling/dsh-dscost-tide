name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tests must pass before publishing
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --test test/plugin.test.mjs
          node scripts/check-publish.mjs

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      - name: Skip when this version is already on npm
        id: exists
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@yanzi-251147/dsh-dscost-tide@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@yanzi-251147/dsh-dscost-tide@${version} is already published — skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the publishable copy
        if: steps.exists.outputs.already != 'true'
        run: |
          node scripts/prepare-publish.mjs --no-pack --out .publish \
            --name "@yanzi-251147/dsh-dscost-tide" \
            --repo "yanzi-251147/dsh-dscost-tide"

      - name: Publish
        if: steps.exists.outputs.already != 'true'
        working-directory: .publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
